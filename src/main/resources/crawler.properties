# Thread pool sizes
crawler.threads=5
parser.threads=5

# Rate limiting
politeness.delay.milliseconds=1000

# Queue limits
queue.max.size=10000

# Storage
storage.type=local
storage.base.path=./crawl_data

# MongoDB
mongo.uri=mongodb://localhost:27017
mongo.database=crawler

# Crawling limits
max.depth=3
max.pages=1000
request.timeout.seconds=10

# Retry policy
max.retries=3
retry.delay.milliseconds=2000

# Crawler identity
user.agent=JavaWebCrawler/1.0 (+https://github.com/yourusername/url-crawler)

# Idle shutdown: seconds with empty queues before stopping
idle.shutdown.seconds=10
